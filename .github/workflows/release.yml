name: Release

# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so this job both
# creates the tag/release and builds the tagged multi-arch image itself.
#
# Triggered by pushing a RELEASE file (first line = tag name) or by hand.
on:
  push:
    paths:
      - RELEASE
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create
        required: false
        default: v1.0.0-fork

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -eu
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(head -n1 RELEASE | tr -d '[:space:]')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists, keeping it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "heisenbridge fork with IRCv3 support $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file IRCV3.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
