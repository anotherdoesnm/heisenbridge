name: Release

# Tags are created by hand here because the fork's automation only has
# GITHUB_TOKEN through Actions; run this once per release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create
        required: true
        default: v1.0.0-fork

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "heisenbridge fork with IRCv3 support $TAG"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file IRCV3.md
